<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><title>ZzZ – Unipäiväkirja</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141a3a">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#141a3a;--bg2:#1c2450;--card:#232c5e;--tx:#eef0ff;--mu:#9aa2d6;--ac:#a9a4ff;--moon:#ffd98a;--ok:#7fe0b5;--bad:#ff8a9b;--ln:rgba(255,255,255,.08)}
[data-t=light]{--bg:#f3f1ff;--bg2:#e8e5ff;--card:#fff;--tx:#1a1f45;--mu:#6b72a8;--ac:#5b52e6;--moon:#e8a317;--ok:#1fa97a;--bad:#d9445c;--ln:rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:linear-gradient(180deg,var(--bg2),var(--bg) 320px) var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
main{max-width:560px;margin:auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom))}
h1{font:600 26px Georgia,serif;margin:6px 0 2px}h2{font-size:15px;margin:0 0 10px;color:var(--mu);font-weight:600}
.sub{color:var(--mu);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;border:1px solid var(--ln)}
.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:132px;height:132px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:600 28px/1 Georgia,serif}.ring small{display:block;font:12px system-ui;color:var(--mu);margin-top:4px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chip{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px}.chip b{display:block;font:600 22px Georgia,serif}.chip span{font-size:12px;color:var(--mu)}
svg text{fill:var(--mu);font:10px system-ui}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.heat i{aspect-ratio:1;border-radius:7px;background:var(--ac)}
.row{display:flex;gap:10px}.row>*{flex:1}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:16px system-ui}
input[type=range]{padding:0;accent-color:var(--ac)}
.tp{display:flex;align-items:center;gap:4px}.tp select{padding:13px 4px;text-align:center;text-align-last:center;min-width:0;flex:1}
.btn{border:0;border-radius:14px;padding:14px;font:600 16px system-ui;background:var(--ac);color:#10143a;width:100%;margin-top:12px}.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}.btn.d{background:var(--bad);color:#fff}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.it:last-child{border:0}
.it .e{font-size:26px}.it .m{flex:1;min-width:0}.it .m div{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it button{background:none;border:0;color:var(--mu);font-size:20px;padding:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:var(--mu);font:11px system-ui;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px}nav button span{font-size:22px}nav .on{color:var(--ac)}
nav .fab{background:var(--ac);color:#10143a;border-radius:50%;width:56px;height:56px;margin-top:-26px;font-size:30px;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#sheet{position:fixed;inset:0;background:rgba(5,8,25,.6);display:none;z-index:9;align-items:flex-end}#sheet.on{display:flex}
#sheet>div{background:var(--bg2);width:100%;max-width:560px;margin:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ok);color:#06231a;padding:10px 18px;border-radius:20px;font-weight:600;opacity:0;transition:.3s;z-index:20;pointer-events:none}#toast.on{opacity:1}
.empty{text-align:center;color:var(--mu);padding:24px 8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
#clock{position:fixed;inset:0;background:rgba(5,8,25,.7);display:none;z-index:30;align-items:center;justify-content:center}#clock.on{display:flex}#clock>div{background:var(--bg2);border-radius:24px;padding:18px;width:min(92vw,340px)}
.ch{font:600 46px Georgia,serif;text-align:center;margin-bottom:6px}.ch span{padding:0 8px;opacity:.45}.ch .on{opacity:1;color:var(--ac)}#dial{width:100%;display:block;touch-action:none;user-select:none}
.tbtn{width:100%;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:600 20px Georgia,serif}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="sheet"><div id="form"></div></div>
<div id="clock"><div><div class="ch" id="chd"></div><svg id="dial" viewBox="0 0 240 240"></svg><div class="row" style="margin-top:8px"><button class="btn g" style="margin:0" onclick="nudge(-1)">−1 min</button><button class="btn g" style="margin:0" onclick="nudge(1)">+1 min</button></div><div class="row"><button class="btn g" onclick="$('clock').classList.remove('on')">Peruuta</button><button class="btn" onclick="okClock()">OK</button></div></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id),K='zzz_v2';
const st={e:JSON.parse(localStorage.getItem(K)||'[]'),goal:+localStorage.zzz_goal||49,theme:localStorage.zzz_theme||'dark',v:'home'};
const save=()=>localStorage.setItem(K,JSON.stringify(st.e));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const hrs=(a,b)=>{if(!a||!b)return 0;const[s,m]=a.split(':').map(Number),[e,n]=b.split(':').map(Number);let d=(e*60+n)-(s*60+m);if(d<=0)d+=1440;return Math.round(d/60*100)/100};
const fh=h=>{const m=Math.round(h*60);return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'};
const emo=r=>['😫','😫','😣','😕','😐','🙂','🙂','😊','😄','😴','🌙'][Math.round(r)]||'🙂';
const wd=['su','ma','ti','ke','to','pe','la'];
const sorted=()=>st.e.slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
function days(n){const o=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=iso(d),es=st.e.filter(x=>x.date===k);const h=es.reduce((a,x)=>a+x.hours,0);const rs=es.filter(x=>x.type==='Yöuni');o.push({k,d,h,r:rs.length?rs.reduce((a,x)=>a+x.rating,0)/rs.length:null,aw:es.reduce((a,x)=>a+x.awake,0)})}return o}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function corr(a,b){const n=a.length;if(n<3)return null;const ma=avg(a),mb=avg(b);let p=0,x=0,y=0;for(let i=0;i<n;i++){p+=(a[i]-ma)*(b[i]-mb);x+=(a[i]-ma)**2;y+=(b[i]-mb)**2}return x&&y?p/Math.sqrt(x*y):null}
/* charts */
function bars(ds,goal){const W=320,H=140,bw=W/ds.length,mx=Math.max(goal+1,...ds.map(d=>d.h));let s=`<svg viewBox="0 0 ${W} ${H+18}" width="100%"><defs><linearGradient id="g1" x1="0" y1="0" y2="1"><stop offset="0" stop-color="var(--ac)"/><stop offset="1" stop-color="var(--ac)" stop-opacity=".35"/></linearGradient></defs>`;
ds.forEach((d,i)=>{const h=d.h/mx*H;s+=`<rect x="${i*bw+bw*.18}" y="${H-h}" width="${bw*.64}" height="${h}" rx="7" fill="url(#g1)"/><text x="${i*bw+bw/2}" y="${H+13}" text-anchor="middle">${wd[d.d.getDay()]}</text>`;if(d.h)s+=`<text x="${i*bw+bw/2}" y="${H-h-4}" text-anchor="middle">${d.h.toFixed(1)}</text>`});
const y=H-goal/mx*H;return s+`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--moon)" stroke-dasharray="4 4"/></svg>`}
function line(ds,goal){const W=320,H=130,mx=Math.max(goal+1,...ds.map(d=>d.h)),pts=ds.map((d,i)=>[i*W/(ds.length-1),H-d.h/mx*H]);const p=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');const y=H-goal/mx*H;
return `<svg viewBox="0 0 ${W} ${H+16}" width="100%"><defs><linearGradient id="g2" x1="0" y1="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".5"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs><path d="${p}L${W} ${H}L0 ${H}Z" fill="url(#g2)"/><path d="${p}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/><line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--moon)" stroke-dasharray="4 4"/><text x="0" y="${H+13}">30 pv sitten</text><text x="${W}" y="${H+13}" text-anchor="end">tänään</text></svg>`}
function ratingDots(ds){const W=320,H=90,v=ds.filter(d=>d.r!=null);if(!v.length)return'';const bw=W/ds.length;return `<svg viewBox="0 0 ${W} ${H+4}" width="100%">`+v.map(d=>{const i=ds.indexOf(d),y=H-d.r/10*H;return `<line x1="${i*bw+bw/2}" x2="${i*bw+bw/2}" y1="${H}" y2="${y}" stroke="var(--ln)" stroke-width="2"/><circle cx="${i*bw+bw/2}" cy="${y}" r="5" fill="${d.r>=7?'var(--ok)':d.r>=4?'var(--moon)':'var(--bad)'}"/>`}).join('')+`</svg>`}
function ring(h,t){const r=56,c=2*Math.PI*r,p=Math.min(1,h/t);return `<div class="ring"><svg width="132" height="132"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--ln)" stroke-width="12"/><circle cx="66" cy="66" r="${r}" fill="none" stroke="${p>=1?'var(--ok)':'var(--moon)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*p} ${c}"/></svg><b><div>${h.toFixed(1)} h<small>tavoite ${t.toFixed(1)} h</small></div></b></div>`}
/* views */
function home(){const d7=days(7),dg=st.goal/7,last=[...days(14)].reverse().find(d=>d.h>0);const w=d7.reduce((a,d)=>a+d.h,0),rs=d7.filter(d=>d.r!=null).map(d=>d.r);
let streak=0;for(const d of [...days(60)].reverse()){if(d.h>=dg*.9)streak++;else if(d.k!==iso(new Date()))break}
return `<h1>Hyvää yötä 🌙</h1><div class="sub">Unipäiväkirja – tiedot pysyvät tällä laitteella</div>
<div class="card hero">${ring(last?last.h:0,dg)}<div><h2>${last?(last.k===iso(new Date())?'Viime yö':'Viimeisin: '+last.d.toLocaleDateString('fi-FI',{day:'numeric',month:'numeric'})):'Ei merkintöjä'}</h2><div style="font-size:34px">${last&&last.r!=null?emo(last.r):'💤'}</div><div class="sub" style="margin:4px 0 0">${last?fh(last.h):'Paina + ja lisää ensimmäinen yö'}</div></div></div>
<div class="card"><h2>Viimeiset 7 päivää</h2>${bars(d7,dg)}</div>
<div class="chips"><div class="chip"><b>${w.toFixed(1)} / ${st.goal}</b><span>viikon tunnit / tavoite</span></div><div class="chip"><b>${(w/7).toFixed(1)} h</b><span>keskiarvo / vrk</span></div><div class="chip"><b>${rs.length?avg(rs).toFixed(1):'–'} ${rs.length?emo(avg(rs)):''}</b><span>keskiarvosana</span></div><div class="chip"><b>${streak} 🔥</b><span>tavoitteessa putkeen</span></div></div>`}
function stats(){const d=days(30),d35=days(35),dg=st.goal/7,v=d.filter(x=>x.h>0);if(!v.length)return `<h1>Tilastot</h1><div class="empty">Lisää muutama yö, niin kuvaajat ilmestyvät.</div>`;
const tp={};st.e.forEach(x=>tp[x.type]=(tp[x.type]||0)+x.hours);const tt=Object.values(tp).reduce((a,b)=>a+b,0);
const best=v.filter(x=>x.r!=null).sort((a,b)=>b.r-a.r)[0],c1=corr(v.filter(x=>x.r!=null).map(x=>x.h),v.filter(x=>x.r!=null).map(x=>x.r)),c2=corr(v.filter(x=>x.r!=null).map(x=>x.aw),v.filter(x=>x.r!=null).map(x=>x.r));
const txt=c=>c==null?'ei vielä riittävästi dataa':(Math.abs(c)<.2?'ei selvää yhteyttä':(c>0?'positiivinen':'negatiivinen')+' ('+c.toFixed(2)+')');
return `<h1>Tilastot</h1><div class="sub">Viimeiset 30 päivää</div>
<div class="card"><h2>Unen määrä (tunnit)</h2>${line(d,dg)}</div>
<div class="card"><h2>Arvosana yöuniin</h2>${ratingDots(d)}</div>
<div class="card"><h2>5 viikkoa – tumma = vähän, kirkas = paljon</h2><div class="heat">${d35.map(x=>`<i title="${x.k}: ${x.h.toFixed(1)} h" style="opacity:${x.h?(.2+.8*Math.min(1,x.h/(dg*1.1))).toFixed(2):.08}"></i>`).join('')}</div></div>
<div class="card"><h2>Unityypit</h2>${Object.entries(tp).map(([k,h])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(k)}</span><span>${h.toFixed(1)} h</span></div><div style="height:8px;border-radius:4px;background:var(--ln)"><div style="height:8px;border-radius:4px;background:var(--ac);width:${h/tt*100}%"></div></div></div>`).join('')}</div>
<div class="card"><h2>Havaintoja</h2><div style="font-size:14px;line-height:1.7">Unen määrä ja arvosana: <b>${txt(c1)}</b><br>Hereilläolo ja arvosana: <b>${txt(c2)}</b>${best?`<br>Paras yö: <b>${best.d.toLocaleDateString('fi-FI')}</b> (${best.r.toFixed(0)}/10, ${fh(best.h)})`:''}</div></div>`}
function hist(){const l=sorted().reverse();return `<h1>Merkinnät</h1><div class="sub">${l.length} merkintää</div><div class="card">${l.length?l.map(x=>`<div class="it"><div class="e">${emo(x.rating)}</div><div class="m"><b>${new Date(x.date).toLocaleDateString('fi-FI',{weekday:'short',day:'numeric',month:'numeric'})}</b> · ${fh(x.hours)} <span style="color:var(--mu)">${esc(x.type)}</span><div>${x.start}–${x.end}${x.wakeups?` · ${x.wakeups}× heräsi`:''}${x.comment?' · '+esc(x.comment):''}</div></div><button onclick="edit('${x.id}')">✎</button><button onclick="del('${x.id}')">🗑</button></div>`).join(''):'<div class="empty">Ei vielä merkintöjä.</div>'}</div>`}
function sett(){return `<h1>Asetukset</h1><div class="sub">&nbsp;</div>
<div class="card"><label>Viikkotavoite (tuntia)</label><input id="goal" type="number" step="0.5" min="1" value="${st.goal}"><label>Teema</label><select id="th"><option value="dark">Yö</option><option value="light">Päivä</option></select><button class="btn" onclick="setS()">Tallenna asetukset</button></div>
<div class="card"><h2>Tiedot</h2><button class="btn g" style="margin:0" onclick="expCsv()">Vie CSV</button><button class="btn g" onclick="$('imp').click()">Tuo CSV (myös vanhasta sovelluksesta)</button><input id="imp" type="file" accept=".csv" hidden onchange="impCsv(this)"><button class="btn d" onclick="wipe()">Tyhjennä kaikki</button></div>
<div class="card" id="inst" style="display:${window.dp?'block':'none'}"><button class="btn" style="margin:0" onclick="doInst()">Asenna sovellus puhelimeen</button></div>
<div class="sub">Tiedot tallentuvat vain tämän selaimen paikalliseen muistiin. Ota CSV-varmuuskopio silloin tällöin – selaimen tietojen tyhjennys poistaa myös merkinnät.</div>`}
function render(){document.documentElement.dataset.t=st.theme;$('app').innerHTML={home,stats,hist,sett}[st.v]();if(st.v==='sett')$('th').value=st.theme;
const t=[['home','🏠','Koti'],['hist','📖','Merkinnät'],['+','＋',''],['stats','📊','Tilastot'],['sett','⚙️','Asetukset']];
$('nav').innerHTML=t.map(([k,i,l])=>k==='+'?`<button class="fab" onclick="openForm()" aria-label="Lisää yö">＋</button>`:`<button class="${st.v===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')}
const go=v=>{st.v=v;render();scrollTo(0,0)};
/* form */
function openForm(id){const x=id?st.e.find(e=>e.id===id):{date:iso(new Date()),start:'23:00',end:'07:00',type:'Yöuni',rating:6,wakeups:0,awake:0,comment:'',est:''};
$('form').innerHTML=`<h1>${id?'Muokkaa merkintää':'Lisää uni'}</h1><div class="row" style="margin-top:8px">${['Yöuni','Päiväuni','Torkku'].map(t=>`<button class="btn ${x.type===t?'':'g'}" style="margin:0;padding:10px" data-ty="${t}" onclick="pickT(this)">${t}</button>`).join('')}</div>
<label>Herätyspäivä</label><input type="date" id="f_d" value="${x.date}"><div class="row"><div><label>Nukkumaan</label>${tp('f_s',x.start)}</div><div><label>Heräsin</label>${tp('f_e',x.end)}</div></div>
<label>Arvosana: <b id="rv">${x.rating} ${emo(x.rating)}</b></label><input type="range" id="f_r" min="0" max="10" value="${x.rating}" oninput="rv.innerHTML=this.value+' '+emo(+this.value)">
<div class="row"><div><label>Heräilyt</label><input type="number" id="f_w" min="0" value="${x.wakeups}"></div><div><label>Hereillä (min)</label><input type="number" id="f_a" min="0" value="${x.awake}"></div></div>
<label>Oma arvio tunneista (tyhjä = lasketaan ajoista)</label><input type="number" step="0.1" min="0" id="f_h" value="${x.est||''}"><label>Kommentti</label><textarea id="f_c" rows="2">${esc(x.comment)}</textarea>
<button class="btn" onclick="saveE('${id||''}')">Tallenna</button><button class="btn g" onclick="closeF()">Peruuta</button>`;window.curT=x.type;$('sheet').classList.add('on')}
const p2=n=>String(n).padStart(2,'0');
const tp=(id,v)=>`<button type="button" class="tbtn" id="${id}" data-v="${v||'00:00'}" onclick="openClock('${id}')">${v||'00:00'}</button>`;
const tv=id=>$(id).dataset.v;
let CK={};
function openClock(id){const[h,m]=tv(id).split(':').map(Number);CK={id,h:h||0,m:m||0,mode:'h'};drawClock();$('clock').classList.add('on')}
function drawClock(){const{h,m,mode}=CK,pos=(i,r)=>[120+r*Math.sin(i*Math.PI/6),120-r*Math.cos(i*Math.PI/6)],hr=mode==='h';
const sel=hr?h%12:m/5,sr=hr?((h>=1&&h<=12)?95:62):95,[sx,sy]=pos(sel,sr);
let s=`<circle cx="120" cy="120" r="116" fill="var(--bg)"/><line x1="120" y1="120" x2="${sx}" y2="${sy}" stroke="var(--ac)" stroke-width="2"/><circle cx="120" cy="120" r="4" fill="var(--ac)"/><circle cx="${sx}" cy="${sy}" r="${hr&&sr===62?16:19}" fill="var(--ac)"/>`;
const t=(x,y,l,on,sz)=>`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" style="font:${sz}px system-ui;fill:${on?'#10143a':'var(--tx)'}">${l}</text>`;
if(hr)for(let i=1;i<=12;i++){let[a,b]=pos(i%12,95),[c,d]=pos(i%12,62);s+=t(a,b,i,h===i,17)+t(c,d,i===12?'00':i+12,h===(i===12?0:i+12),13)}
else for(let k=0;k<12;k++){const[a,b]=pos(k,95);s+=t(a,b,p2(k*5),m===k*5,17)}
$('dial').innerHTML=s;$('chd').innerHTML=`<span class="${hr?'on':''}" onclick="CK.mode='h';drawClock()">${p2(h)}</span>:<span class="${hr?'':'on'}" onclick="CK.mode='m';drawClock()">${p2(m)}</span>`}
function pick(e){const d=$('dial'),r=d.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,dist=Math.hypot(dx,dy)*240/r.width,ang=(Math.atan2(dx,-dy)*180/Math.PI+360)%360,i=Math.round(ang/30)%12;
if(CK.mode==='h')CK.h=dist>78?(i===0?12:i):(i===0?0:i+12);else CK.m=i*5;drawClock()}
const dl=$('dial');dl.addEventListener('pointerdown',e=>{CK.d=true;dl.setPointerCapture(e.pointerId);pick(e)});dl.addEventListener('pointermove',e=>{if(CK.d)pick(e)});
dl.addEventListener('pointerup',()=>{CK.d=false;if(CK.mode==='h'){CK.mode='m';drawClock()}});
const nudge=d=>{CK.m=(CK.m+d+60)%60;CK.mode='m';drawClock()};
function okClock(){const v=p2(CK.h)+':'+p2(CK.m),b=$(CK.id);b.dataset.v=v;b.textContent=v;$('clock').classList.remove('on')}
const edit=id=>openForm(id),closeF=()=>$('sheet').classList.remove('on');
function pickT(b){window.curT=b.dataset.ty;document.querySelectorAll('[data-ty]').forEach(e=>e.classList.toggle('g',e!==b))}
function saveE(id){const est=parseFloat($('f_h').value),s=tv('f_s'),e=tv('f_e');if(!$('f_d').value||!s||!e)return alert('Täytä päivä sekä nukkumaan- ja heräämisaika.');
const o={id:id||Date.now().toString(36),date:$('f_d').value,start:s,end:e,type:window.curT,rating:+$('f_r').value,wakeups:+$('f_w').value||0,awake:+$('f_a').value||0,comment:$('f_c').value,est:est||'',hours:est>0?est:hrs(s,e)};
if(id)st.e[st.e.findIndex(x=>x.id===id)]=o;else st.e.push(o);save();closeF();render();toast('Tallennettu ✓')}
function del(id){if(confirm('Poistetaanko merkintä?')){st.e=st.e.filter(x=>x.id!==id);save();render()}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
function setS(){st.goal=+$('goal').value||49;st.theme=$('th').value;localStorage.zzz_goal=st.goal;localStorage.zzz_theme=st.theme;render();toast('Asetukset tallennettu ✓')}
/* csv */
const H=['id','sleep_date','sleep_start','sleep_end','estimated_hours','rating','wakeups','awake_minutes','comment','sleep_type','created_at'];
function expCsv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const r=[H.join(',')].concat(sorted().map(x=>[x.id,x.date,x.start,x.end,x.est,x.rating,x.wakeups,x.awake,x.comment,x.type,''].map(q).join(',')));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.join('\n')],{type:'text/csv'}));a.download='zzz_'+iso(new Date())+'.csv';a.click()}
function parseCsv(t){const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==','){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';R.push(r);r=[]}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R}
function impCsv(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{const R=parseCsv(t.replace(/^\ufeff/,'')),hd=R.shift();let n=0;R.forEach(r=>{const o={};hd.forEach((h,i)=>o[h.trim()]=r[i]);if(!o.sleep_date||!o.sleep_start||!o.sleep_end)return;
if(st.e.some(x=>x.date===o.sleep_date&&x.start===o.sleep_start&&x.end===o.sleep_end))return;const est=parseFloat(o.estimated_hours);
st.e.push({id:Date.now().toString(36)+n,date:o.sleep_date,start:o.sleep_start,end:o.sleep_end,type:o.sleep_type||'Yöuni',rating:+o.rating||0,wakeups:+o.wakeups||0,awake:+o.awake_minutes||0,comment:o.comment||'',est:est||'',hours:est>0?est:hrs(o.sleep_start,o.sleep_end)});n++});save();render();toast('Tuotu '+n+' riviä')});inp.value=''}
function wipe(){if(confirm('Poistetaanko KAIKKI merkinnät? Tätä ei voi perua.')){st.e=[];save();render()}}
/* install + sw */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.dp=e;if(st.v==='sett')render()});
const doInst=()=>window.dp&&window.dp.prompt();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeF()});
render();
</script></body></html>
